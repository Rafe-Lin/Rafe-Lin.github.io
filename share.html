<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>y0tta's Blog - Shared Post</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico?v=2" type="image/x-icon">
    <link rel="apple-touch-icon" href="src/apple-touch-icon.png">
    <meta name="theme-color" content="#071116">
    <script src="page-meta.js" defer></script>
</head>

<body>
    <nav>
        <div class="nav-left">
            <span class="brand-mark">
                <img src="src/profile-avatar.webp" alt="" width="40" height="40">
            </span>
            <span class="blog-title">y0tta's Blog</span>
        </div>
        <div class="nav-center">
            <!-- 分享頁面不顯示導航切換按鈕 -->
        </div>
        <div class="nav-right">
        </div>
    </nav>
    <div class="container">
        <main id="main-content" tabindex="-1" class="page-main full-width">
            <div class="box blog-content" id="blog-content">
                <div id="html-output"></div>
                <script src="script.js"></script>
            </div>
        </main>
    </div>
    <footer>
        <p>© 2025 y0tta. All rights reserved.</p>
    </footer>
    <script src="particles-bg.js"></script>
    <script>
        // 分享頁面：自動讓容器顯示
        document.addEventListener("DOMContentLoaded", function () {
            const container = document.querySelector('.container');
            container.classList.add('loaded');
        });
    </script>
</body>

</html>
